PackageIdentifier: Hewako.AxelLauncher
PackageVersion: VERSION
InstallerType: nullsoft        # NSIS: winget сам передаёт /S для тихой установки
Scope: user                    # installMode currentUser — без прав администратора
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install       # новая версия ставится поверх
Installers:
  - Architecture: x64
    # Ссылка на конкретную версию, не на latest: winget сверяет сумму файла.
    InstallerUrl: https://github.com/Hewako/axel-launcher/releases/download/vVERSION/Axel-Launcher-Windows.exe
    InstallerSha256: SHA256
ManifestType: installer
ManifestVersion: 1.6.0
