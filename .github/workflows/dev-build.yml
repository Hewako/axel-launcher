# Сборка разработчика для Windows: dev-launch (запуск без входа, Ely.by без Microsoft),
# только отладочный режим. Запускается отправкой коммита в ветку `dev-build`
# (git push origin HEAD:refs/heads/dev-build) или вручную из Actions.
#
# Результат кладётся ТОЛЬКО в черновик релиза: черновики видят лишь владельцы репозитория.
# Черновик не публиковать — в открытом релизе такую сборку скачал бы кто угодно.
# Приложение называется «Axel Launcher Dev» (так же подписано окно); установщик сам удаляет
# обычный Axel Launcher (installer/hooks-dev.nsh), миры и профили остаются.
name: Сборка разработчика

on:
  push:
    branches: [dev-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (dev-launch)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: dev-windows

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Зависимости интерфейса
        working-directory: ui
        run: npm ci

      - name: Сборка Axel Launcher Dev
        working-directory: ui
        shell: bash
        env:
          QUARRY_MS_CLIENT_ID: ${{ secrets.QUARRY_MS_CLIENT_ID }}
          QUARRY_CURSEFORGE_KEY: ${{ secrets.QUARRY_CURSEFORGE_KEY }}
          # Те же настройки, что у [profile.release]: размер и скорость как у обычного Axel'.
          # Отладочные проверки (debug_assertions) остаются — без них dev-launch не собирается.
          CARGO_PROFILE_DEV_OPT_LEVEL: "3"
          CARGO_PROFILE_DEV_DEBUG: "false"
          CARGO_PROFILE_DEV_STRIP: "true"
          CARGO_PROFILE_DEV_LTO: "true"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
          CARGO_PROFILE_DEV_PANIC: abort
          CARGO_PROFILE_DEV_INCREMENTAL: "false"
        run: |
          # Своё имя: «Dev» видно в названии приложения; хуки удаляют обычный Axel' перед установкой.
          echo '{"productName":"Axel Launcher Dev","identifier":"com.quarry.launcher.dev","bundle":{"windows":{"nsis":{"installerHooks":"installer/hooks-dev.nsh"}}}}' > dev-config.json
          npm run tauri build -- --debug --features dev-launch --bundles nsis --config dev-config.json

      - name: В черновик релиза (не публиковать)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Название по схеме владельца: следующий номер после последнего rc, с пометкой -d,
          # например v0.1.0-rc.10-d. Версия — из Cargo.toml. Только черновик.
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          last=$(gh api "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' \
            | grep -oE "^v${ver}-rc\.[0-9]+" | sed 's/.*rc\.//' | sort -n | tail -1)
          tag="v${ver}-rc.$(( ${last:-0} + 1 ))-d"
          exe=$(ls target/debug/bundle/nsis/*.exe | head -1)
          cp "$exe" Axel-Launcher-Dev-Windows.exe
          gh release create "$tag" Axel-Launcher-Dev-Windows.exe --repo "$REPO" --draft --prerelease \
            --target "$SHA" --title "Axel' $tag" \
            --notes "Сборка разработчика (d): вход через Ely.by без Microsoft. Черновик, не публиковать. Коммит $SHA."
